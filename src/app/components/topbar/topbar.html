<div class="flex h-[66px] items-center gap-4 border-b border-line bg-surface px-6">
  <div class="min-w-0 flex-1">
    <ng-content select="[topbar-search]" />
  </div>

  @if (planLabel()) {
    <app-badge variant="neutral">{{ planLabel() }}</app-badge>
  }

  <button
    type="button"
    class="flex shrink-0 items-center gap-2.5 rounded-md p-1 hover:bg-surface-muted"
    (click)="userMenuClicked.emit()"
  >
    <app-avatar [initials]="userInitials()" size="sm" [ariaLabel]="userName()" />
    <span class="hidden text-left sm:block">
      <span class="block text-sm font-medium text-ink">{{ userName() }}</span>
      @if (userSubtitle()) {
        <span class="block text-xs text-ink-muted">{{ userSubtitle() }}</span>
      }
    </span>
  </button>

  <button
    type="button"
    class="shrink-0 rounded-md px-3 py-1.5 text-sm font-medium text-ink-muted hover:bg-surface-muted hover:text-ink"
    (click)="handleLogout()"
  >
    Cerrar sesión
  </button>
</div>
