<div class="flex min-h-svh items-center justify-center bg-surface-muted px-4 py-10">
  <div class="w-full max-w-md">
    <app-card padding="lg" ariaLabel="Iniciar sesión">
      <form (submit)="handleSubmit($event)" class="flex flex-col gap-4" novalidate>
        <div>
          <h1 class="font-heading text-xl font-semibold text-ink">Iniciar sesión</h1>
          <p class="mt-1 text-sm text-ink-muted">Ingresa a tu cuenta de Dential.</p>
        </div>

        @if (serverError()) {
          <app-alert variant="danger" testId="login-server-error">{{ serverError() }}</app-alert>
        }

        <app-text-input
          label="Correo electrónico"
          type="email"
          autocomplete="email"
          [formField]="loginForm.email"
          [errorText]="emailErrorText()"
          testId="login-email"
        />

        <app-text-input
          label="Contraseña"
          type="password"
          autocomplete="current-password"
          [formField]="loginForm.password"
          [errorText]="passwordErrorText()"
          testId="login-password"
        />

        <app-button type="submit" [loading]="submitting()" [disabled]="submitting()" testId="login-submit">
          Iniciar sesión
        </app-button>

        <p class="text-center text-sm text-ink-muted">
          ¿No tienes una cuenta?
          <a routerLink="/signup" class="font-medium text-primary hover:underline">Regístrate</a>
        </p>
      </form>
    </app-card>
  </div>
</div>
